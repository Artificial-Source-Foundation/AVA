name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
    env:
      CC: gcc-16
      CXX: g++-16
      GITACHE_ROOT: ${{ github.workspace }}/.gitache
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev universal-ctags

      - name: Restore gitache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GITACHE_ROOT }}
          key: gitache-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            gitache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake -S . -B build -G Ninja -DAVA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  sanitizer:
    name: Sanitizers
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev

      - name: Configure
        run: cmake -S . -B build-sanitize -G Ninja -DAVA_BUILD_TESTS=ON -DAVA_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure --parallel
