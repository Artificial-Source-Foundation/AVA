name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      GITACHE_ROOT: ${{ github.workspace }}/.gitache
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev

      - name: Restore gitache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GITACHE_ROOT }}
          key: gitache-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            gitache-${{ runner.os }}-

      - name: Configure
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake -S . -B build -G Ninja -DAVA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  sanitizer:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libncursesw5-dev pkg-config libboost-dev

      - name: Configure
        run: cmake -S . -B build-sanitize -G Ninja -DAVA_BUILD_TESTS=ON -DAVA_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure --parallel
